name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # One shell everywhere, so the test glob expands on Windows too.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # The supported floor, so the service is tested on the oldest Node users may have.
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            git-service/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install webview libraries (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Install and build git-service
        working-directory: git-service
        run: |
          npm ci
          npm run build

      - name: Test git-service
        run: node --test git-service/tests/*.test.mjs

      # Before cargo: the Tauri context embeds ../dist at compile time.
      - name: Build frontend
        run: npm run build

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
